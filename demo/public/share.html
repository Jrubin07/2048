<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chia · Vet summary</title>
  <style>
    :root { --ink: #1d1b18; --muted: #66615a; --line: #ddd6cb; --flag: #b4510f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ece8e1; color: var(--ink); font: 12.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bar { max-width: 210mm; margin: 1rem auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0 .5rem; }
    .bar button { font: inherit; font-size: 14px; padding: .55rem 1rem; border-radius: 10px; border: none; background: #c2602e; color: #fff; font-weight: 600; cursor: pointer; }
    .page { width: 210mm; min-height: 297mm; margin: 0 auto 2rem; background: #fff; padding: 14mm 15mm; box-shadow: 0 2px 20px rgba(0,0,0,.08); }
    header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 10px; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 5px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 3px; }
    .status { font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
    .green { color: #2f8f5b; } .amber { color: #a07507; } .orange { color: #c2560f; } .red { color: #c62f2f; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    ul { margin: 0; padding-left: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 2px 5px; border-bottom: 1px solid #eee8de; }
    th { color: var(--muted); font-weight: 600; }
    td.flag { color: var(--flag); font-weight: 700; }
    .note { color: var(--muted); }
    footer { margin-top: 14px; color: var(--muted); font-size: 10.5px; border-top: 1px solid var(--line); padding-top: 6px; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .page { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 0; }
      @page { size: A4; margin: 12mm; }
    }
    @media (max-width: 820px) { .page { width: auto; min-height: 0; margin: 0 .5rem 1rem; padding: 1rem; } .cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="bar"><a href="/">← Back to Chia</a><button onclick="window.print()">Print / Save as PDF</button></div>
  <div class="page" id="page">Loading…</div>
<script>
'use strict';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const byDate = (a, b) => a.date.localeCompare(b.date);

(async () => {
  const id = new URLSearchParams(location.search).get('dog');
  const res = await fetch('/api/dogs/' + encodeURIComponent(id));
  if (!res.ok) { document.getElementById('page').textContent = 'Dog not found.'; return; }
  const d = await res.json();
  document.title = `${d.name} · vet summary`;
  const weights = [...d.weights].sort(byDate).slice(-5);
  const habits = [...d.habits].sort(byDate).slice(-7);
  const lab = [...d.labs].sort(byDate).pop();
  const records = [...d.records].sort(byDate).reverse().slice(0, 5);
  const signals = d.signals.filter((s) => s.level !== 'info');

  document.getElementById('page').innerHTML = `
    <header>
      <div>
        <h1>${esc(d.name)} <span style="font-weight:400;color:var(--muted)">· health summary</span></h1>
        <div>${esc(d.breed)} · ${d.sex === 'female' ? 'Female' : 'Male'}${d.neutered ? (d.sex === 'female' ? ' (spayed)' : ' (neutered)') : ''} · ${esc(d.age)} (born ${fmt(d.birthDate)}) · Microchip ${esc(d.microchip)}</div>
        <div class="note">Generated by Chia on ${fmt(new Date().toISOString().slice(0, 10))} from the owner's records and daily check-ins.</div>
      </div>
      <div class="status ${d.status.color}">${esc(d.status.label)}</div>
    </header>

    <h2>Current signals (rule-based)</h2>
    ${signals.length ? `<ul>${signals.map((s) => `<li><strong>${esc(s.title)}</strong> (${esc(s.area)}). ${esc(s.detail)}</li>`).join('')}</ul>` : '<p>No warning signals.</p>'}

    <div class="cols">
      <div>
        <h2>Medical basics</h2>
        <dl>
          <dt>Allergies</dt><dd>${esc(d.allergies.join(', ') || 'None known')}</dd>
          <dt>Conditions</dt><dd>${esc(d.conditions.join(', ') || 'None known')}</dd>
          <dt>Medications</dt><dd>${d.medications.map((m) => `${esc(m.name)}, ${esc(m.dose)}`).join('<br>') || 'None'}</dd>
          <dt>Diet</dt><dd>${esc(d.diet)}</dd>
          <dt>Vaccines</dt><dd>${d.vaccines.map((v) => `${esc(v.name)} (${fmt(v.date)})`).join(', ')}</dd>
        </dl>
        <h2>Weight</h2>
        <table><tr>${weights.map((w) => `<th>${fmt(w.date)}</th>`).join('')}</tr><tr>${weights.map((w) => `<td>${w.kg} kg</td>`).join('')}</tr></table>
      </div>
      <div>
        <h2>Care team</h2>
        <dl>
          <dt>Usual vet</dt><dd>${esc(d.clinic.vet)}, ${esc(d.clinic.name)}, ${esc(d.clinic.phone)}</dd>
          <dt>Emergency</dt><dd>${esc(d.emergencyClinic.name)}, ${esc(d.emergencyClinic.phone)}</dd>
        </dl>
        ${lab ? `<h2>Latest labs · ${esc(lab.panel)} · ${fmt(lab.date)}</h2>
        <table><tr><th>Test</th><th>Result</th><th>Range</th></tr>
        ${lab.values.map((v) => { const f = v.value > v.high ? ' H' : v.value < v.low ? ' L' : ''; return `<tr><td>${esc(v.name)}</td><td class="${f ? 'flag' : ''}">${v.value} ${esc(v.unit)}${f}</td><td>${v.low}–${v.high}</td></tr>`; }).join('')}
        </table>` : ''}
      </div>
    </div>

    <h2>Daily check-ins · last 7 days</h2>
    <table>
      <tr><th>Date</th><th>Appetite</th><th>Water</th><th>Energy</th><th>Stool</th><th>Vomit</th><th>Walk</th><th>Note</th></tr>
      ${habits.map((h) => `<tr><td>${fmt(h.date)}</td>
        <td class="${h.appetite !== 'normal' ? 'flag' : ''}">${esc(h.appetite)}</td>
        <td class="${h.water !== 'normal' ? 'flag' : ''}">${esc(h.water)}</td>
        <td class="${h.energy === 'low' ? 'flag' : ''}">${esc(h.energy)}</td>
        <td class="${!['normal'].includes(h.stool) ? 'flag' : ''}">${esc(h.stool)}</td>
        <td class="${h.vomiting ? 'flag' : ''}">${h.vomiting}</td>
        <td>${h.walkMinutes} min</td><td>${esc(h.note)}</td></tr>`).join('')}
    </table>

    <h2>Recent records</h2>
    <ul>${records.map((r) => `<li><strong>${fmt(r.date)} · ${esc(r.title)}</strong>: ${esc(r.text)}</li>`).join('')}</ul>

    <footer>Owner-reported data and Chia's automated rule-based signals. Not a diagnosis. Chia demo: all names, clinics and values are made up.</footer>`;
})();
</script>
</body>
</html>
